[project]
name = "comps-arena"
version = "0.1.0"
description = "Trading comps for any US-listed company from SEC filings, with a fighting-game style arena page"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
comps = "comps_arena.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["comps_arena"]
